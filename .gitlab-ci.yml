# CI pipeline — lint, typecheck, and test on every push.
# Integration tests run against a real Postgres service (the concurrency
# guarantee can only be proven against a real engine, not a mock).

image: node:22

stages:
  - verify

variables:
  POSTGRES_DB: miqi_booking_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/miqi_booking_test?schema=public"

verify:
  stage: verify
  services:
    - postgres:16
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma migrate deploy
    - npx prisma generate
  script:
    - npm run lint
    - npm run typecheck
    - npm test
